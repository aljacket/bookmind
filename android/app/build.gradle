apply plugin: 'com.android.application'

// Release signing (upload key for Play App Signing). Nothing secret lives in the repo:
// values come from environment variables first, then from android/keystore.properties
// (git-ignored; template in android/keystore.properties.example). See README "Release build".
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('keystore.properties')
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}
def signingValue = { String envName, String propName ->
    def fromEnv = System.getenv(envName)
    fromEnv ? fromEnv : keystoreProperties.getProperty(propName)
}
def uploadStoreFile = signingValue('BOOKMIND_UPLOAD_STORE_FILE', 'storeFile')
def uploadStorePassword = signingValue('BOOKMIND_UPLOAD_STORE_PASSWORD', 'storePassword')
def uploadKeyAlias = signingValue('BOOKMIND_UPLOAD_KEY_ALIAS', 'keyAlias')
def uploadKeyPassword = signingValue('BOOKMIND_UPLOAD_KEY_PASSWORD', 'keyPassword')
def hasReleaseSigning = uploadStoreFile && uploadStorePassword && uploadKeyAlias && uploadKeyPassword

android {
    namespace = "com.bookmind.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.bookmind.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile rootProject.file(uploadStoreFile)
                storePassword uploadStorePassword
                keyAlias uploadKeyAlias
                keyPassword uploadKeyPassword
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }
}

// Fail fast instead of producing an unsigned release that Play would reject.
tasks.matching { it.name in ['bundleRelease', 'assembleRelease', 'packageReleaseBundle'] }.configureEach {
    doFirst {
        if (!hasReleaseSigning) {
            throw new GradleException(
                'Release signing is not configured. Set BOOKMIND_UPLOAD_STORE_FILE, BOOKMIND_UPLOAD_STORE_PASSWORD, ' +
                'BOOKMIND_UPLOAD_KEY_ALIAS and BOOKMIND_UPLOAD_KEY_PASSWORD, or create android/keystore.properties ' +
                'from android/keystore.properties.example (see README, "Release build").')
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
